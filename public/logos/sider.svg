<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sider-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3B82F6"/>
      <stop offset="100%" stopColor="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sider-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8B5CF6"/>
      <stop offset="100%" stopColor="#6D28D9"/>
    </linearGradient>
    <linearGradient id="sider-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06B6D4"/>
      <stop offset="100%" stopColor="#3B82F6"/>
    </linearGradient>
    <linearGradient id="sider-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A78BFA"/>
      <stop offset="100%" stopColor="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Sider AI 3D Geometric Origami Facets -->
  <!-- Top wing / facet -->
  <polygon points="50,16 82,34 50,52 18,34" fill="url(#sider-grad3)"/>
  
  <!-- Left lower facet -->
  <polygon points="18,34 50,52 50,86 18,68" fill="url(#sider-grad1)"/>
  
  <!-- Right lower facet -->
  <polygon points="50,52 82,34 82,68 50,86" fill="url(#sider-grad2)"/>
  
  <!-- Center AI Core Diamond Glow -->
  <polygon points="50,38 62,52 50,66 38,52" fill="url(#sider-glow)" opacity="0.9"/>
  <circle cx="50" cy="52" r="3.5" fill="#FFFFFF"/>
</svg>
